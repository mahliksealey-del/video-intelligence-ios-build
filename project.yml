name: VideoIntelligenceNative
options:
  minimumXcodeGenVersion: 2.47.0
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  ArgmaxOSSSwift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.1

settings:
  base:
    SWIFT_VERSION: "5"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  VideoIntelligenceNative:
    type: application
    platform: iOS
    sources:
      - path: VideoIntelligenceNative
    dependencies:
      - package: ArgmaxOSSSwift
        product: WhisperKit
      - framework: Runtime/PythonResources/Python.xcframework
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.videointelligence.nativeprototype
        PRODUCT_NAME: VideoIntelligence
        PRODUCT_MODULE_NAME: VideoIntelligenceNative
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: VideoIntelligenceNative/Runtime/PythonBridge.h
        INFOPLIST_KEY_CFBundleDisplayName: Video Intelligence
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Video Intelligence imports media you select and keeps your library in its Documents folder.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Video Intelligence imports videos you explicitly select from your photo library.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets:
        - VideoIntelligenceNativeTests
    postBuildScripts:
      - name: Install embedded Python standard library
        script: |
          bash "$PROJECT_DIR/scripts/install-python-runtime.sh"

  VideoIntelligenceNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VideoIntelligenceNativeTests
        excludes:
          - Fixtures
      - path: VideoIntelligenceNativeTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: VideoIntelligenceNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.videointelligence.nativeprototype.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VideoIntelligence.app/VideoIntelligence"
        BUNDLE_LOADER: "$(TEST_HOST)"

